# Zero-AWS quickstart: coatcheck with secrets from environment variables.
#
# Needs Docker. From the repo root:
#
#   export COATCHECK_API_TOKEN=$(openssl rand -hex 32)
#   docker compose -f examples/docker-compose.env.yml up --build --wait
#   # Mint a ticket: {"token":"cct_...","expires_in":900,...}
#   TICKET=$(curl -s -H "Authorization: Bearer $COATCHECK_API_TOKEN" \
#     localhost:3128/_vault/example-api-key | sed 's/.*"token":"\([^"]*\)".*/\1/')
#   curl -s localhost:3128/_ca > /tmp/coatcheck-ca.crt
#   curl -s --proxy http://coatcheck:$COATCHECK_API_TOKEN@localhost:3128 \
#     --cacert /tmp/coatcheck-ca.crt \
#     -H "Authorization: Bearer $TICKET" https://httpbin.org/headers
#   docker compose -f examples/docker-compose.env.yml logs coatcheck   # [swap] ... result=hit
#   docker compose -f examples/docker-compose.env.yml down
#
# httpbin echoes the request headers back: the ticket was swapped for the demo
# value on the way out. Demo values only.
#
# The env provider maps `example-api-key` to COATCHECK_SECRET_EXAMPLE_API_KEY
# (names are [a-z0-9-]+: uppercase, '-' -> '_').
services:
  coatcheck:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - COATCHECK_PROVIDER=env
      - COATCHECK_SECRET_EXAMPLE_API_KEY=sk-demo-not-a-real-key
      - COATCHECK_SECRET_EXAMPLE_ECHO_KEY=sk-demo-echo-not-a-real-key
      - 'COATCHECK_SECRET_EXAMPLE_LOGIN={"username":"demo@example.com","password":"hunter2","_cleartext":["username"]}'
      # Published ports need a non-loopback bind. In production run as a
      # sidecar and keep the default 127.0.0.1.
      - COATCHECK_BIND_HOST=0.0.0.0
      # Required off loopback. Not hard-coded: a token published in this file
      # would authenticate nothing.
      - COATCHECK_API_TOKEN=${COATCHECK_API_TOKEN:?set COATCHECK_API_TOKEN, e.g. export COATCHECK_API_TOKEN=$$(openssl rand -hex 32)}
      - COATCHECK_CDP_ENABLED=${COATCHECK_CDP_ENABLED:-0}
      - COATCHECK_CDP_ADVERTISE_HOST=${COATCHECK_CDP_ADVERTISE_HOST:-127.0.0.1}
      - COATCHECK_POLICY_FILE=/etc/coatcheck/policy.json
    volumes:
      - ./policy.example.json:/etc/coatcheck/policy.json:ro
    ports:
      - '3128:3128'
      - '8444:8444'
