# Local demo: coatcheck backed by LocalStack (SSM + Secrets Manager).
#
#   export COATCHECK_API_TOKEN=$(openssl rand -hex 32)
#   docker compose -f examples/docker-compose.localstack.yml up --build
#   curl -s -H "Authorization: Bearer $COATCHECK_API_TOKEN" \
#     localhost:3128/_vault/example-api-key              # -> {"token":"cct_...", ...}
#   curl -s localhost:3128/_ca > /tmp/coatcheck-ca.crt
#   curl -s --proxy http://coatcheck:$COATCHECK_API_TOKEN@localhost:3128 \
#     --cacert /tmp/coatcheck-ca.crt \
#     -H "Authorization: Bearer cct_..." https://httpbin.org/headers
#
# httpbin echoes the real value back: the demo policy binds example-api-key to
# httpbin.org. The same ticket sent to any other host gets 403. Demo only.
services:
  coatcheck:
    build:
      context: ..
      dockerfile: Dockerfile.dev
    environment:
      - COATCHECK_PROVIDER=aws
      - COATCHECK_AGENT_ID=demo
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      # Published ports need a non-loopback bind. In production run as a
      # sidecar and keep the default 127.0.0.1.
      - COATCHECK_BIND_HOST=0.0.0.0
      # Required off loopback. Not hard-coded: a token published in this file
      # would authenticate nothing.
      - COATCHECK_API_TOKEN=${COATCHECK_API_TOKEN:?set COATCHECK_API_TOKEN, e.g. export COATCHECK_API_TOKEN=$$(openssl rand -hex 32)}
      - COATCHECK_CDP_ENABLED=${COATCHECK_CDP_ENABLED:-0}
      - COATCHECK_CDP_ADVERTISE_HOST=${COATCHECK_CDP_ADVERTISE_HOST:-127.0.0.1}
      # No COATCHECK_AWS_ROLE_ARN: STS AssumeRole is skipped, static creds are used.
      # Default prefixes: /coatcheck/secrets/ (SSM) and coatcheck/ (Secrets Manager).
      - COATCHECK_POLICY_FILE=/etc/coatcheck/policy.json
    volumes:
      - ./policy.example.json:/etc/coatcheck/policy.json:ro
    ports:
      - '3128:3128'
      - '8444:8444'
    depends_on:
      localstack:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.8
    environment:
      - SERVICES=ssm,secretsmanager,sts
    volumes:
      - ./localstack-init.sh:/etc/localstack/init/ready.d/seed.sh:ro
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 3s
      retries: 10
